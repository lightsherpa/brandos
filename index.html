<!doctype html>
<html lang="en" data-theme="light" data-palette="plex-registry" data-density="cozy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrandOS</title>
  <link rel="icon" href="/caastor/assets/icon-white.svg" />
  <link rel="stylesheet" href="/caastor/ds-tokens.css" />
  <link rel="stylesheet" href="/caastor/portal.css" />
  <link rel="stylesheet" href="/caastor/caastor-tokens.css" />
  <link rel="stylesheet" href="/caastor/plex-registry.css" />
  <style>
    /* Hide tweaks defaults until app boots */
    [data-pending-boot] { opacity: 0; }
  </style>
</head>
<body>
  <div id="app">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-family: 'Instrument Sans', system-ui, sans-serif;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #1C1917; animation: bootpulse 1.6s ease-in-out infinite;"></div>
      <div style="font-size: 13px; color: #78716C;">BrandOS is starting</div>
      <style>
        @keyframes bootpulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50%      { transform: scale(1.15); opacity: 0.55; }
        }
      </style>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
