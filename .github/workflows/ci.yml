name: CI

on:
  pull_request:
  push:
    branches: [main, "rc/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm run test:units
      # Delegation route tests need module mocks. Do not pass the server/src
      # directory: Node executes server/src/index.js and the API never exits.
      - run: npm run test:delegation
